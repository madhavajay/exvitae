      id: "1448427005"
      url: https://www.clinpgx.org/summaryAnnotation/1448427005
    notes: rs1128503 (ABCB1); gefitinib; Carcinoma, Non-Small-Cell Lung (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_1448427005_aa
        label: AA
        binding:
          source: variant
          variant: rs1128503.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype and non-small cell lung cancer may have an increased risk for diarrhea and skin rash
          when treated with gefitinib as compared to patients with the AG or GG genotype. Other genetic and clinical factors may
          also influence drug toxicity risk in patients receiving gefitinib.
      - id: clinpgx_summary_1448427005_ag
        label: AG
        binding:
          source: variant
          variant: rs1128503.yaml
          allele: G
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype and non-small cell lung cancer may have a decreased risk for diarrhea and skin rash
          when treated with gefitinib as compared to patients with the AA genotype. Other genetic and clinical factors may also
          influence drug toxicity risk in patients receiving gefitinib.
      - id: clinpgx_summary_1448427005_gg
        label: GG
        binding:
          source: variant
          variant: rs1128503.yaml
          allele: G
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype GG.
        text:
