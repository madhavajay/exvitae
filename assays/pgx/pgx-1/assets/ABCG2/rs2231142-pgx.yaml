      url: https://www.clinpgx.org/labelAnnotation/PA166345301
    notes: Annotation of HCSC Label for rosuvastatin and ABCG2, SLCO1B1
    pgx_action_level: Actionable PGx
    summary:
      The product monograph for rosuvastatin states that genetic variants in SLCO1B1 (OATP1B1) and ABCG2 (BCRP) have
      been shown to be associated with an increase in rosuvastatin exposure. For patients known to have the SLCO1B1 c.521CC
      or ABCG2 c.421AA genotype, a maximum once daily dose of 20 mg of ACH-Rosuvastatin is recommended.
    prescribing_information:
      "Genetic Polymorphisms: Genotypes of SLCO1B1 (OATP1B1) c.521CC and ABCG2 (BCRP) c.421AA have been
      shown to be associated with an increase in rosuvastatin exposure (AUC) compared to SLCO1B1 c.521TT and ABCG2 c.421CC.
      For patients known to have the c.521CC or c.421AA genotype, a maximum once daily dose of 20 mg of ACH-Rosuvastatin is
      recommended."
    prescribing_actions:
      - Dosing Info
