    pgx_action_level: Actionable PGx
    summary:
      The Swiss drug label for ezetimibe/rosuvastatin (Ezetimib-Rosuvastatin-Mepha Kapseln) states that genetic polymorphisms
      in SLCO1B1 and ABCG2  may lead to an increase in rosuvastatin exposure, a reduction in the dosage is recommended.
    prescribing_information:
      'Dosage: Specific types of genetic polymorphisms are known that may lead to an increase in rosuvastatin
      exposure (see "Pharmacokinetics"). In patients in whom such a polymorphism is known, a reduction in the dosage of ezetimib-rosuvastatin
      mepha is recommended.'
