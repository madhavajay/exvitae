    summary:
      The Swiss drug label for rosuvastatin (Crestor) states that genetic polymorphisms in SLCO1B1 and ABCG2  may lead
      to an increase in rosuvastatin exposure, a reduction in the dosage is recommended.
    prescribing_information: |-
      Increased plasma levels of rosuvastatin have been observed in Asians (see "Warnings and Precautions" and "Pharmacokinetics"). The recommended starting dose for Asians is 5 mg and the dose of 40 mg is contraindicated.
      Genetic polymorphisms
      Specific types of genetic polymorphisms are known that may lead to an increase in rosuvastatin exposure (see "Pharmacokinetics"). In patients known to have such a polymorphism, a reduction in the dosage of Crestor is recommended.
      Genetic polymorphisms
