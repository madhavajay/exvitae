      url: https://www.clinpgx.org/summaryAnnotation/1183703019
    notes: rs1800544 (ADRA2A); methylphenidate; Attention Deficit Disorder with Hyperactivity (level 4 Efficacy)
    effects:
      - id: clinpgx_summary_1183703019_cc
        label: CC
        binding:
          source: variant
          variant: rs1800544.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients (mainly pediatric patients) with the CC genotype and attention deficit hyperactivity disorder (ADHD) may
          have a poorer response to methylphenidate treatment as compared to patients with the CG or GG genotype. However, contradictory
          evidence exists for this association. Studies used different scales to analyze improvement, e.g. CGI-I, ARS-IV, and
          other. Other genetic and clinical factors may also influence response to methylphenidate.
      - id: clinpgx_summary_1183703019_cg
        label: CG
        binding:
          source: variant
          variant: rs1800544.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CG.
        text:
          Patients (mainly pediatric patients) with the CG genotype and attention deficit hyperactivity disorder (ADHD) may
          have a better response to methylphenidate treatment as compared to patients with the CC genotype. However, contradictory
          evidence exists for this association. Studies used different scales to analyze improvement, e.g. CGI-I, ARS-IV, and
          other. Other genetic and clinical factors may also influence response to methylphenidate.
      - id: clinpgx_summary_1183703019_gg
        label: GG
