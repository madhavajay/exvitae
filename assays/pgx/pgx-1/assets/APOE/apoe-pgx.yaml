    pgx_action_level: Testing Required
    evidence:
      source: ClinPGx
      kind: label_annotation
      id: PA166313401
      url: https://www.clinpgx.org/labelAnnotation/PA166313401
    notes:
      The FDA label for lecanemab includes warnings that testing should be performed for ApoE E4/E4 because individuals
      with ApoE E4/E4 have increased risk for amyloid related imaging abnormalities (ARIA) when treated with lecanemab.
