    evidence:
      source: ClinPGx
      kind: label_annotation
      id: PA166104866
      url: https://www.clinpgx.org/labelAnnotation/PA166104866
    notes:
      The FDA-approved pravastatin label contains pharmacogenetic information regarding response results in patients with
