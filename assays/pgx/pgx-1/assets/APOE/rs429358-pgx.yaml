    notes:
      rs429358 (APOE); Antivirals for treatment of HIV infections, combinations or ritonavir; HIV Infections and Hyperlipidemias
      (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_655384666_cc
        label: CC
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype who are treated with antiretrovirals for HIV such as ritonavir may have an increased
          risk for elevated plasma lipids as compared to patients with the TT genotype. Other genetic and clinical factors, in
          particular rs7412, may also influence a patient's risk for adverse events with ritonavir treatment.
      - id: clinpgx_summary_655384666_ct
        label: CT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype who are treated with antiretrovirals for HIV such as ritonavir may have an increased
          risk for elevated plasma lipids as compared to patients with the TT genotype. Other genetic and clinical factors, in
          particular rs7412, may also influence a patient's risk for adverse events with ritonavir treatment.
      - id: clinpgx_summary_655384666_tt
        label: TT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype who are treated with antiretrovirals for HIV such as ritonavir may have a decreased
          but not non-existent risk for elevated plasma lipids as compared to patients with the CC or CT genotype. Other genetic
          and clinical factors, in particular rs7412, may also influence a patient's risk for adverse events with ritonavir treatment.
