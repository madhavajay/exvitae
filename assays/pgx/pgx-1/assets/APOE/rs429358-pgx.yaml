    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1450975180"
      url: https://www.clinpgx.org/summaryAnnotation/1450975180
    notes: rs429358 (APOE); warfarin (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1450975180_cc
        label: CC
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          African-American patients with the CC genotype (E4/E4) may require a shorter duration of time to reach a stable
          warfarin dose as compared to African-American patients with the TT genotype (especially those who are APOE E3/E3, also
          having rs7412 CC). Other genetic and clinical factors may also influence the response to warfarin.
      - id: clinpgx_summary_1450975180_ct
        label: CT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          African-American patients with the CT genotype (carriers of E4) may require a shorter duration of time to reach
          a stable warfarin dose as compared to African-American patients with the TT genotype (especially those who are APOE
          E3/E3, also having rs7412 CC). Other genetic and clinical factors may also influence the response to warfarin.
      - id: clinpgx_summary_1450975180_tt
        label: TT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          African-American patients with the TT genotype (especially those who are APOE E3/E3, also having rs7412 CC) may
          require a longer duration of time to reach a stable warfarin dose as compared to African-American patients with the
          CC or CT genotype (carriers of E4). Other genetic and clinical factors may also influence the response to warfarin.
