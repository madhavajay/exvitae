    label: rs429358 / simvastatin / Efficacy
    authority_type: evidence_summary
    genes:
      - APOE
    variant: rs429358
    drugs:
      - name: simvastatin
        pharmgkb_id: PA451363
    phenotypes:
      - Myocardial Infarction
    phenotype_categories:
      - Efficacy
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1183532576"
      url: https://www.clinpgx.org/summaryAnnotation/1183532576
    notes: rs429358 (APOE); simvastatin; Myocardial Infarction (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1183532576_cc
        label: CC
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype (ApoE E4/E4) may have an increased risk of mortality after myocardial infarction as
          compared to the TT genotype, which may be mitigated by simvastatin treatment. Therefore, these patients may actually
          benefit more from simvastatin treatment.  Other genetic and clinical factors may also influence a patient's response
          to simvastatin treatment.
      - id: clinpgx_summary_1183532576_ct
        label: CT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype (ApoE E4 carriers) may have an increased risk of mortality after myocardial infarction
          as compared to the TT genotype, which may be mitigated by simvastatin treatment. Therefore, these patients may actually
          benefit more from simvastatin treatment.  Other genetic and clinical factors may also influence a patient's response
          to simvastatin treatment.
      - id: clinpgx_summary_1183532576_tt
        label: TT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype may have a decreased risk of mortality after myocardial infarction as compared to
          the CC or CT genotypes (ApoE E2 carriers), which may be mitigated by simvastatin treatment. Other genetic and clinical
          factors may also influence a patient's response to simvastatin treatment.
