  - schema: bioscript:pgx-summary:1.0
    id: clinpgx_summary_1449269938
    label: rs429358 / acenocoumarol, warfarin / Toxicity
    authority_type: evidence_summary
    genes:
      - APOE
    variant: rs429358
    drugs:
      - name: acenocoumarol
        pharmgkb_id: PA452632
      - name: warfarin
        pharmgkb_id: PA451906
    phenotypes:
      - Hemorrhage
      - Venous thromboembolism
    phenotype_categories:
      - Toxicity
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1449269938"
      url: https://www.clinpgx.org/summaryAnnotation/1449269938
    notes: rs429358 (APOE); acenocoumarol or warfarin; Hemorrhage and venous thromboembolism (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_1449269938_cc
        label: CC
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with thromboembolism and the CC genotype may have an increased risk of hemorrhage when treated with acenocoumarol
          or warfarin as compared to patients with the CT or TT genotypes. Other clinical and genetic factors may also influence
          risk of hemorrhage in patients with venous thromboembolism.
      - id: clinpgx_summary_1449269938_ct
        label: CT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with thromboembolism and the CT genotype may have an increased risk of hemorrhage when treated with acenocoumarol
          or warfarin as compared to patients with the TT genotypes and decreased risk as compared to patients with the CC genotype.
          Other clinical and genetic factors may also influence risk of hemorrhage in patients with venous thromboembolism.
      - id: clinpgx_summary_1449269938_tt
        label: TT
        binding:
          source: variant
          variant: rs429358.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with thromboembolism and the TT genotype may have a decreased risk of hemorrhage when treated with acenocoumarol
          or warfarin as compared to patients with the CT or CC genotypes. Other clinical and genetic factors may also influence
          risk of hemorrhage in patients with venous thromboembolism.
