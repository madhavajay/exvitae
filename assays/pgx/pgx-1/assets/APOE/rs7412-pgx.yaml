    notes: rs7412 (APOE); atorvastatin; Coronary Disease and Hyperlipidemias (level 2B Efficacy)
    effects:
      - id: clinpgx_summary_1183492249_cc
        label: CC
        binding:
          source: variant
          variant: rs7412.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the rs7412 CC genotype may have decreased response to atorvastatin as compared to patients with the
          CT or TT genotype. Other genetic and clinical factors may also influence response to atorvastatin treatment.
      - id: clinpgx_summary_1183492249_ct
        label: CT
        binding:
          source: variant
          variant: rs7412.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the rs7412 CT genotype may have increased response to atorvastatin as compared to patients with the
          CC genotype. Other genetic and clinical factors may also influence response to atorvastatin treatment.
      - id: clinpgx_summary_1183492249_tt
        label: TT
        binding:
          source: variant
          variant: rs7412.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the rs7412 TT genotype may have increased response to atorvastatin as compared to patients with the
          CC genotype. Other genetic and clinical factors may also influence response to atorvastatin treatment.
