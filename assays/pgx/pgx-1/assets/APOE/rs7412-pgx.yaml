      id: "1183492128"
      url: https://www.clinpgx.org/summaryAnnotation/1183492128
    notes: rs7412 (APOE); fluvastatin (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1183492128_cc
        label: CC
        binding:
          source: variant
          variant: rs7412.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype who are treated with fluvastatin may have a reduced response (a smaller reduction
          in LDL-cholesterol or change in HDL) as compared to patients with the CT genotype (carriers of E2). Other genetic and
          clinical factors may also influence a patient's response to statin treatment.
      - id: clinpgx_summary_1183492128_ct
        label: CT
        binding:
          source: variant
          variant: rs7412.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype (carriers of E2) who are treated with fluvastatin may have a better response (increased
          reduction in LDL-cholesterol or change in HDL) as compared to patients with the CC genotype. Other genetic and clinical
          factors may also influence a patient's response to statin treatment.
      - id: clinpgx_summary_1183492128_tt
        label: TT
        binding:
          source: variant
          variant: rs7412.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype (also known as E2/E2) who are treated with fluvastatin may have a better response
          (increased reduction in LDL-cholesterol or change in HDL) as compared to patients with the CC genotype, although the
          studies did not have C homozygotes and only reported the effect for the heterozygote. Other genetic and clinical factors
          may also influence a patient's response to statin treatment.
