    label: Annotation of FDA Label for lecanemab and APOE
    authority_type: regulatory_label
    genes:
      - APOE
    variant: rs7412
    drugs:
      - name: lecanemab
        pharmgkb_id: PA166313301
    regulatory_sources:
      - FDA
    source_type: Drug Label
    evidence:
      source: ClinPGx
      kind: label_annotation
      id: PA166313401
      url: https://www.clinpgx.org/labelAnnotation/PA166313401
    notes: Annotation of FDA Label for lecanemab and APOE
    pgx_action_level: Testing Required
    summary:
      The FDA label for lecanemab includes warnings that testing should be performed for ApoE E4/E4 as individuals with
      ApoE E4/E4 have increased risk for amyloid related imaging abnormalities (ARIA) when treated with lecanemab. The label
      does not give details on the E4/E4 allele.
    prescribing_information:
      Testing for ApoE ε4 status should be performed prior to initiation of treatment to inform the risk
      of developing ARIA. Prior to testing, prescribers should discuss with patients the risk of ARIA across genotypes and the
      implications of genetic testing results.
    prescribing_actions:
      - Other Guidance
