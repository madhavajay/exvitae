  - schema: bioscript:pgx-summary:1.0
    id: clinpgx_summary_1183492181
    label: rs7412 / pravastatin / Efficacy
    authority_type: evidence_summary
    genes:
      - APOE
    variant: rs7412
    drugs:
      - name: pravastatin
        pharmgkb_id: PA451089
    phenotypes: []
    phenotype_categories:
      - Efficacy
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1183492181"
      url: https://www.clinpgx.org/summaryAnnotation/1183492181
    notes: rs7412 (APOE); pravastatin (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1183492181_cc
        label: CC
        binding:
          source: variant
          variant: rs7412.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype (non-carriers of APOE E2) who are treated with pravastatin may have a reduced response
          (a smaller reduction in LDL-cholesterol) as compared to patients with the TT genotype (also known as APOE E2/E2). Other
          genetic and clinical factors may also influence a patient's response to pravastatin treatment.
      - id: clinpgx_summary_1183492181_ct
        label: CT
        binding:
          source: variant
          variant: rs7412.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype (carriers of APOE E2) who are treated with pravastatin may have a better response
          (increased reduction in LDL-cholesterol) as compared to patients with the CC genotype (non-carriers of APOE E2). Other
          genetic and clinical factors may also influence a patient's response to pravastatin treatment.
      - id: clinpgx_summary_1183492181_tt
        label: TT
        binding:
          source: variant
          variant: rs7412.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype (also known as APOE E2/E2) who are treated with pravastatin may have a better response
          (increased reduction in LDL-cholesterol) as compared to patients with the CC genotype. Other genetic and clinical factors
          may also influence a patient's response to pravastatin treatment.
