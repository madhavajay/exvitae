name: APOE-pgx-rs7412
version: "1.0"
schema: bioscript:variant:1.0
gene: APOE
summary:
  APOE pharmacogenomics panel entry for rs7412. This variant is interpreted together with rs429358 by the APOE epsilon
  assay.
identifiers:
  rsids:
    - rs7412
  aliases:
    - rs3200542
coordinates:
  grch37:
    chrom: "19"
    pos: 45412079
  grch38:
    chrom: "19"
    pos: 44908822
alleles:
  kind: snv
  ref: C
  alts:
    - T
  observed_alts:
    - T
provenance:
  sources:
    - kind: database
      label: dbSNP / NCBI variation services via exr rsid-lookup --store
      url: https://www.ncbi.nlm.nih.gov/snp/rs7412
      fields:
        - identifiers.rsids
        - identifiers.aliases
        - alleles
        - alleles.observed_alts
    - kind: database
      label: Ensembl GRCh37 via exr rsid-lookup --store
      url: https://grch37.ensembl.org/Homo_sapiens/Variation/Explore?v=rs7412
      fields:
        - coordinates.grch37
    - kind: database
      label: Ensembl GRCh38 via exr rsid-lookup --store
      url: https://www.ensembl.org/Homo_sapiens/Variation/Explore?v=rs7412
      fields:
        - coordinates.grch38
    - kind: database
      label: ClinPGx / PharmGKB variant summary annotations PA166155341 via exr pgx-lookup --sidecar
      url: https://www.clinpgx.org/variant/PA166155341/summaryAnnotation
      fields:
        - findings[0]
findings:
  - schema: bioscript:pgx-summary:1.0
    id: apoe_pgx_rs7412_pgx_sidecar
    include: rs7412-pgx.yaml
    binding:
      source: variant
      variant: rs7412.yaml
      key: alt
      operator: equals
      value: T
      description: Loads this sidecar when the participant carries the expected PGx-significant rs7412 alt allele T.
    notes: Detailed ClinPGx/PharmGKB summary and drug-label findings are stored in the sidecar file.
