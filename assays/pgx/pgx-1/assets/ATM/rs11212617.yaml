name: ATM-pgx-rs11212617
version: "1.0"
schema: bioscript:variant:1.0
gene: ATM
summary: ATM pharmacogenomics panel entry for rs11212617 with detailed ClinPGx/PharmGKB summary annotations attached in rs11212617-pgx.yaml. dbSNP/Ensembl lookup reports the physical locus gene as C11orf65.
identifiers:
  rsids:
    - rs11212617
  aliases: []
coordinates:
  grch37:
    chrom: "11"
    pos: 108283161
  grch38:
    chrom: "11"
    pos: 108412434
alleles:
  kind: snv
  ref: C
  alts:
    - A
  observed_alts:
    - A
provenance:
  sources:
    - kind: database
      label: dbSNP / NCBI variation services via exr rsid-lookup --store
      url: https://www.ncbi.nlm.nih.gov/snp/rs11212617
      fields:
        - identifiers.rsids
        - identifiers.aliases
        - alleles
        - alleles.observed_alts
    - kind: database
      label: Ensembl GRCh37 via exr rsid-lookup --store
      url: https://grch37.ensembl.org/Homo_sapiens/Variation/Explore?v=rs11212617
      fields:
        - coordinates.grch37
    - kind: database
      label: Ensembl GRCh38 via exr rsid-lookup --store
      url: https://www.ensembl.org/Homo_sapiens/Variation/Explore?v=rs11212617
      fields:
        - coordinates.grch38
    - kind: database
      label: ClinPGx / PharmGKB variant summary annotations PA166154450 via exr pgx-lookup --sidecar
      url: https://www.clinpgx.org/variant/PA166154450/summaryAnnotation
      fields:
        - findings[0]
findings:
  - schema: bioscript:pgx-summary:1.0
    id: atm_pgx_rs11212617_pgx_sidecar
    include: rs11212617-pgx.yaml
    binding:
      source: variant
      variant: rs11212617.yaml
      key: alt
      operator: equals
      value: A
      description: Loads this sidecar when the participant carries the expected PGx-significant rs11212617 alt allele A.
    notes: Detailed ClinPGx/PharmGKB summary findings are stored in the sidecar file.
