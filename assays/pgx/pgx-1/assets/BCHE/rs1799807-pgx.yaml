    pgx_action_level: Actionable PGx
    summary:
      Succinylcholine (QUELICIN) is rapid acting, depolarizing skeletal muscle relaxant indicated as an adjunct to general
      anesthesia. The label warns that individuals who are carriers of the atypical variant of the plasma cholinesterase gene
      ( BCHE ) are at risk of prolonged apnea if administered succinylcholine. The label also notes the risk for malignant hyperthermia.
    prescribing_information: |-
      Excerpts from the succinylcholine chloride (QUELICIN) drug label:
      Succinylcholine is contraindicated in persons with personal or familial history of malignant hyperthermia, skeletal muscle myopathies, and known hypersensitivity to the drug.
      Succinylcholine is metabolized by plasma cholinesterase and should be used with caution, if at all, in patients known to be or suspected of being homozygous for the atypical plasma cholinesterase gene.
