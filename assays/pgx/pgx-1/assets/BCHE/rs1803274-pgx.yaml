    drugs:
      - name: rivastigmine
        pharmgkb_id: PA451262
    phenotypes:
      - Alzheimer Disease
      - Lewy Body Disease
    phenotype_categories:
      - Efficacy
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1447990050"
      url: https://www.clinpgx.org/summaryAnnotation/1447990050
    notes: rs1803274 (BCHE); rivastigmine; Alzheimer Disease and Lewy Body Disease (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1447990050_cc
        label: CC
        binding:
          source: variant
          variant: rs1803274.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype and Lewy Body disease or Alzheimer's disease may have an improved response to rivastigmine
          as compared to patients with the TT genotype, and as compared to patients with the CT genotype, although some studies
          show contradictory results. Other clinical and genetic factors may also influence response to rivastigmine in patients
          with Lewy Body disease or Alzheimer's disease.
      - id: clinpgx_summary_1447990050_ct
        label: CT
        binding:
          source: variant
          variant: rs1803274.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype and Lewy Body disease or Alzheimer's disease may have an improved response to rivastigmine
          as compared to patients with the TT genotype, although some studies show contradictory results. Other clinical and genetic
          factors may also influence response to rivastigmine in patients with Lewy Body disease or Alzheimer's disease.
      - id: clinpgx_summary_1447990050_tt
        label: TT
        binding:
          source: variant
          variant: rs1803274.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype and Lewy Body disease or Alzheimer's disease may have worse response to rivastigmine
          as compared to patients with the CC genotype, as well as the CT genotype, although some studies show contradictory results.
          Other clinical and genetic factors may also influence response to rivastigmine in patients with Lewy Body disease or
          Alzheimer's disease.
