          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype have an decreased risk of post anesthesia apnea when treated with succinylcholine
          as compared to patients with the AA genotype and an increased risk of post anesthesia apnea as compared to patients
          with the GG genotype. Other genetic and clinical factors may also influence risk of post anesthesia apnea.
      - id: clinpgx_summary_1184513893_gg
