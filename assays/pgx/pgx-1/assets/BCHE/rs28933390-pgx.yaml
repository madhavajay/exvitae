          variant: rs28933390.yaml
          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AC.
        text:
          Patients with the AC genotype have a decreased risk of post anesthesia apnea when treated with succinylcholine as
          compared to patients with the AA genotype and an increased risk of post anesthesia apnea as compared to patients with
          the CC genotype. Other genetic and clinical factors may also influence risk of post anesthesia apnea.
      - id: clinpgx_summary_1184513898_cc
