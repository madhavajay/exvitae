        text:
          Patients with the AA genotype have an increased risk of post anesthesia apnea when treated with succinylcholine
          as compared to patients with the CC genotype. Other genetic and clinical factors may also influence risk of post anesthesia
          apnea.
      - id: clinpgx_summary_1184513898_ac
