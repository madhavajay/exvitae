    notes: rs6265 (BDNF); olanzapine; Schizophrenia (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1446896644_cc
        label: CC
        binding:
          source: variant
          variant: rs6265.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype and schizophrenia may have a better response when treated with olanzapine as compared
          to patients with the CT or TT genotype. Other genetic and clinical factors may also influence response to olanzapine.
      - id: clinpgx_summary_1446896644_ct
