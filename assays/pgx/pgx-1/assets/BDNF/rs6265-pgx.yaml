          variant: rs6265.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype and schizophrenia may have a poorer response when treated with olanzapine as compared
          to patients with the CC genotype. Other genetic and clinical factors may also influence response to olanzapine.
