          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype and major depression may have increased risk for suicide when treated with citalopram
          as compared to patients with the GG genotype or may have decreased, but not absent, risk for suicide when treated with
          citalopram as compared to patients with the AA genotype. Other genetic and clinical factors may also influence a patient's
          response citalopram.
