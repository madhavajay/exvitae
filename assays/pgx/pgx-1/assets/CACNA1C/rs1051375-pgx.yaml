        binding:
          source: variant
          variant: rs1051375.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype, hypertension and stable coronary artery disease, are more likely to benefit from
          treatment with verapamil compared to treatment with atenolol. Other genetic and clinical factors may also influence
          a patient's response to treatment.
