          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype, hypertension and stable coronary artery disease, may respond similarily to treatment
          with atenolol or verapamil. Other genetic and clinical factors may also influence a patient's response to treatment.
