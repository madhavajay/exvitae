    effects:
      - id: clinpgx_summary_1451238460_aa
        label: AA
        binding:
          source: variant
          variant: rs4680.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the rs4680 AA genotype and who are being treated with buprenorphine with optional fentanyl and tramadol
          for prescription opioid dependence may report more skin redness as compared to patients with the AG genotype. This drug-variant
          pair has been assigned a “no recommendation” by CPIC, as it was determined to be not clinically actionable. However,
          the direction of this association was reversed after the deprescription programme had ended. Other genetic and clinical
          factors may also affect the incidence of skin redness during treatment for opioid dependence.
