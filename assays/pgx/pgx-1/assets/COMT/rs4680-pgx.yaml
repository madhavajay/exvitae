          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype who are treated with nicotine replacement therapy may have a decreased likelihood
          of smoking cessation and increased risk of relapse as compared to patients with the AA genotype. However, some contradictory
          evidence exists. Other genetic and clinical factors may also influence a patient's response to nicotine replacement
          therapy.
      - id: clinpgx_summary_981202618_gg
