          source: variant
          variant: rs4680.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype and Schizophrenia who are treated with antipsychotics may have increased methylation
          at sites within the COMT gene promoter as compared to patients with the GG genotype. Metabolic syndrome was also associated
          with increased methylation. No significant difference was seen in levels of methylation of the COMT gene promoter in
          patients with or without metabolic syndrome with the AA genotype. Other genetic and clinical factors may also influence
          a patient's level of methylation of the COMT gene promoter when treated with antipsychotics.
      - id: clinpgx_summary_981202674_ag
        label: AG
        binding:
          source: variant
          variant: rs4680.yaml
          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype and Schizophrenia who are treated with antipsychotics may have increased methylation
          at sites within the COMT gene promoter as compared to patients with the GG genotype or decreased methylation at sites
          within the COMT gene promoter as compared to patients with the AA genotype. Metabolic syndrome was associated with increased
          methylation. No significant difference was seen in levels of methylation of the COMT gene promoter in patients with
          or without metabolic syndrome with the AG genotype. Other genetic and clinical factors may also influence a patient's
          level of methylation of the COMT gene promoter when treated with antipsychotics.
      - id: clinpgx_summary_981202674_gg
        label: GG
        binding:
          source: variant
          variant: rs4680.yaml
          allele: G
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype GG.
        text:
          Patients with the GG genotype and Schizophrenia who are treated with antipsychotics may have decreased methylation
          at sites within the COMT gene promoter as compared to patients with the AA genotype. Metabolic syndrome was associated
          with increased methylation. Patients with the GG genotype who are treated with antipsychotics and have metabolic syndrome
          may have similar levels of methylation at sites within the COMT gene promoter to those seen in patients with the AA
          genotype without metabolic syndrome. Other genetic and clinical factors may also influence methylation of the COMT gene
          promoter. Other genetic and clinical factors may also influence a patient's level of methylation of the COMT gene promoter
