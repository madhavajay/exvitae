    notes: rs4680 (COMT); nicotine; Tobacco Use Disorder (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_981202618_aa
        label: AA
        binding:
          source: variant
          variant: rs4680.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype who are treated with nicotine replacement therapy may have an increased likelihood
          of smoking cessation and decreased risk of relapse as compared to patients with the GG genotype. However, some contradictory
          evidence exists. Other genetic and clinical factors may also influence a patient's response to nicotine replacement
          therapy.
