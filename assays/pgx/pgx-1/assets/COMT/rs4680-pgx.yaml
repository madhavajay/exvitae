  - schema: bioscript:pgx-summary:1.0
    id: clinpgx_summary_1451226166
    label: rs4680 / methadone / Toxicity
    authority_type: evidence_summary
    genes:
      - COMT
    variant: rs4680
    drugs:
      - name: methadone
        pharmgkb_id: PA450401
    phenotypes:
      - Neonatal Abstinence Syndrome
    phenotype_categories:
      - Toxicity
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1451226166"
      url: https://www.clinpgx.org/summaryAnnotation/1451226166
    notes: rs4680 (COMT); methadone; Neonatal Abstinence Syndrome (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_1451226166_aa
        label: AA
        binding:
          source: variant
          variant: rs4680.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Infants who have been exposed to methadone in utero and who are born to women with the AA genotype may be more likely
          to require treatment with at least two medications for neonatal abstinence syndrome as compared to infants born to women
          with the AG or GG genotypes. Be aware that this annotation is on the mother's genotype, even though the phenotype is
          observed in the infant and that this was not a statistically significant association. Other genetic and clinical factors
          may also affect severity of neonatal abstinence syndrome.
      - id: clinpgx_summary_1451226166_ag
        label: AG
        binding:
          source: variant
          variant: rs4680.yaml
          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Infants who have been exposed to methadone in utero and who are born to women with the AG genotype may be less likely
          to require treatment with at least two medications for neonatal abstinence syndrome as compared to infants born to women
          with the AA genotype. Be aware that this annotation is on the mother's genotype, even though the phenotype is observed
          in the infant and that this was not a statistically significant association. Other genetic and clinical factors may
          also affect severity of neonatal abstinence syndrome.
      - id: clinpgx_summary_1451226166_gg
        label: GG
        binding:
          source: variant
          variant: rs4680.yaml
          allele: G
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype GG.
        text:
