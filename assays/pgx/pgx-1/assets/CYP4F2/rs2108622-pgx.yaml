          source: variant
          variant: rs2108622.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype may have decreased steady-state levels of vitamin E when taking vitamin E supplements
          as compared to patients with the CT and TT genotypes. Other clinical and genetic factors may also influence steady-state
          levels of vitamin E in patients taking vitamin E supplements.
      - id: clinpgx_summary_1184472841_ct
        label: CT
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype may have decreased steady-state levels of vitamin E when taking vitamin E supplements
          as compared to patients with the TT genotypes, and increased steady-state levels as compared to patients with the CC
          genotypes. Other clinical and genetic factors may also influence steady-state levels of vitamin E in patients taking
          vitamin E supplements.
      - id: clinpgx_summary_1184472841_tt
        label: TT
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
