      url: https://www.clinpgx.org/summaryAnnotation/1184661194
    notes: rs2108622 (CYP4F2); acenocoumarol; Atrial Fibrillation (level 2A Dosage)
    effects:
      - id: clinpgx_summary_1184661194_cc
        label: CC
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the rs2108622 CC genotype who are treated with acenocoumarol may require a lower dose as compared
          to patients with the CT or TT genotype. However, conflicting evidence has been reported. Other genetic and clinical
          factors may also influence required acenocoumarol dose.
      - id: clinpgx_summary_1184661194_ct
        label: CT
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the rs2108622 CT genotype who are treated with acenocoumarol may require a lower dose as compared
          to patients with the TT genotype or may require a higher dose as compared to patients with the CC genotype. However,
          conflicting evidence has been reported. Other genetic and clinical factors may also influence required acenocoumarol
          dose.
      - id: clinpgx_summary_1184661194_tt
        label: TT
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the rs2108622 TT genotype who are treated with acenocoumarol may require a higher dose as compared
          to patients with the CC genotype. However, conflicting evidence has been reported. Other genetic and clinical factors
          may also influence required acenocoumarol dose.
