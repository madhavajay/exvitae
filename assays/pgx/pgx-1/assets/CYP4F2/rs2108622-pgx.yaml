    notes: rs2108622 (CYP4F2); warfarin; over-anticoagulation (level 4)
    effects:
      - id: clinpgx_summary_1449269278_cc
        label: CC
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype who are treated with warfarin may have an increased risk of over-anticoagulation as
          compared to patients with the TT genotype, although not all studies support this. Other clinical factors such as target
