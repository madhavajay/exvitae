        label: CT
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype and acute coronary syndrome may have increased platelet aggregation with epinephrine
          when treated with aspirin and clopidogrel as compared to patients with the CC or TT genotype and and a decreased response
          to aspirin and clopidogrel in patients with the TT genotype. Other genetic and clinical factors may also influence a
          patient's response to aspirin and clopidogrel.
      - id: clinpgx_summary_1444703346_tt
        label: TT
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype and acute coronary syndrome may have decreased platelet aggregation with epinephrine
          when treated with aspirin and clopidogrel as compared to patients with the CT genotype and and an increased response
          to aspirin and clopidogrel in patients with the CC or CT genotype. Other genetic and clinical factors may also influence
          a patient's response to aspirin and clopidogrel.
