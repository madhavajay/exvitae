          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype who are treated with warfarin may have a decreased risk of over-anticoagulation as
          compared to patients with the TT genotype, although not all studies support this. Other clinical factors such as target
          INR, and dosage (which is also associated with this particular variant) and genetic factors may also influence risk
          of over-anticoagulation in patients administered warfarin.
      - id: clinpgx_summary_1449269278_tt
        label: TT
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype who are treated with warfarin may have a decreased risk of over-anticoagulation as
          compared to patients with the CT or CC genotype, although not all studies support this. Other clinical factors such
          as target INR, and dosage (which is also associated with this particular variant) and genetic factors may also influence
          risk of over-anticoagulation in patients administered warfarin.
