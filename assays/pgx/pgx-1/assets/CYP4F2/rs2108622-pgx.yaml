      - id: clinpgx_summary_1444703346_cc
        label: CC
        binding:
          source: variant
          variant: rs2108622.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype and acute coronary syndrome may have decreased platelet aggregation with epinephrine
          when treated with aspirin and clopidogrel as compared to patients with the CT genotype and a decreased response to aspirin
          and clopidogrel in patients with the TT genotype. Other genetic and clinical factors may also influence a patient's
          response to aspirin and clopidogrel.
