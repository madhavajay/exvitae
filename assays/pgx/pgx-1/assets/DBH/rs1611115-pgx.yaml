    notes:
      rs1611115 (DBH); Analgesics, Antiinflammatory agents, non-steroids, Ergot alkaloids, opioids or sumatriptan; Substance
      Withdrawal Syndrome (level 3)
    effects:
      - id: clinpgx_summary_1184987471_cc
        label: CC
        binding:
          source: variant
          variant: rs1611115.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype with substance withdrawal syndrome may have an increased likelihood of headache when
          discontinuing the use of analgesics (such as opioids, NSAIDs, triptans, ergot) as compared to patients with the TT genotype.
          Other clinical and genetic factors may also influence likelihood of headache in patients with withdrawal syndrome who
          discontinue the use of analgesics.
      - id: clinpgx_summary_1184987471_ct
        label: CT
        binding:
          source: variant
          variant: rs1611115.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype with substance withdrawal syndrome may have a decreased likelihood of headache when
          discontinuing the use of analgesics (such as opioids, NSAIDs, triptans, ergot) as compared to patients with the CC genotype.
          Other clinical and genetic factors may also influence likelihood of headache in patients with withdrawal syndrome who
          discontinue the use of analgesics.
      - id: clinpgx_summary_1184987471_tt
