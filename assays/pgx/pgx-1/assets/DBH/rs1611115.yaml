name: DBH-pgx-rs1611115
version: "1.0"
schema: bioscript:variant:1.0
gene: DBH
summary:
  DBH pharmacogenomics panel entry for rs1611115 with detailed ClinPGx/PharmGKB summary annotations attached in rs1611115-pgx.yaml.
  This is a single-variant DBH marker, not a star allele.
identifiers:
  rsids:
    - rs1611115
  aliases:
    - rs60944937
coordinates:
  grch37:
    chrom: "9"
    pos: 136500515
  grch38:
    chrom: "9"
    pos: 133635393
alleles:
  kind: snv
  ref: T
  alts:
    - C
  observed_alts:
    - A
    - C
    - G
provenance:
  sources:
    - kind: database
      label: dbSNP / NCBI variation services via exr rsid-lookup --store
      url: https://www.ncbi.nlm.nih.gov/snp/rs1611115
      fields:
        - identifiers.rsids
        - identifiers.aliases
        - alleles
        - alleles.observed_alts
    - kind: database
      label: Ensembl GRCh37 via exr rsid-lookup --store
      url: https://grch37.ensembl.org/Homo_sapiens/Variation/Explore?v=rs1611115
      fields:
        - coordinates.grch37
    - kind: database
      label: Ensembl GRCh38 via exr rsid-lookup --store
      url: https://www.ensembl.org/Homo_sapiens/Variation/Explore?v=rs1611115
      fields:
        - coordinates.grch38
    - kind: database
      label: ClinPGx / PharmGKB variant summary annotations PA166157734 via exr pgx-lookup --sidecar
      url: https://www.clinpgx.org/variant/PA166157734/summaryAnnotation
      fields:
        - findings[0]
findings:
  - schema: bioscript:pgx-summary:1.0
    id: dbh_pgx_rs1611115_pgx_sidecar
    include: rs1611115-pgx.yaml
    binding:
      source: variant
      variant: rs1611115.yaml
      key: alt
      operator: equals
      value: C
      description: Loads this sidecar when the participant carries the expected PGx-significant rs1611115 alt allele C.
    notes: Detailed ClinPGx/PharmGKB summary findings are stored in the sidecar file.
