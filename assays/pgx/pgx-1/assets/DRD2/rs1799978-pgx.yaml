        text:
          Patients with the CC genotype who are heroin dependent may require a decreased dose of methadone as compared to
          patients with the TT genotype. Other genetic and clinical factors may also influence methadone dose.
      - id: clinpgx_summary_1447980677_ct
        label: CT
