          source: variant
          variant: rs1799978.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype who are heroin dependent may require a decreased dose of methadone as compared to
          patients with the TT genotype, or an increased dose as compared to patients with the CC genotype. Other genetic and
          clinical factors may also influence methadone dose.
      - id: clinpgx_summary_1447980677_tt
        label: TT
        binding:
          source: variant
          variant: rs1799978.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype who are heroin dependent may require an increased dose of methadone as compared to
          patients with the CC genotype. Other genetic and clinical factors may also influence methadone dose.
