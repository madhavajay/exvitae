  - schema: bioscript:pgx-summary:1.0
    id: clinpgx_summary_655387652
    label: rs1799978 / risperidone / Efficacy
    authority_type: evidence_summary
    genes:
      - DRD2
    variant: rs1799978
    drugs:
      - name: risperidone
        pharmgkb_id: PA451257
    phenotypes:
      - Schizophrenia
    phenotype_categories:
      - Efficacy
    evidence_level: "4"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "655387652"
      url: https://www.clinpgx.org/summaryAnnotation/655387652
    notes: rs1799978 (DRD2); risperidone; Schizophrenia (level 4 Efficacy)
    effects:
      - id: clinpgx_summary_655387652_cc
        label: CC
        binding:
          source: variant
          variant: rs1799978.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype and schizophrenia who are treated with risperidone may be less likely to have improvement
          in symptoms as compared to patients with the CT or TT genotype. However, conflicting evidence has been reported. Other
          genetic and clinical factors may also influence a patient's response to risperidone.
      - id: clinpgx_summary_655387652_ct
        label: CT
        binding:
          source: variant
          variant: rs1799978.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype and schizophrenia who are treated with risperidone may be less likely to have an improvement
          in symptoms compared to TT carriers, and more likely to have improvement in symptoms as compared to patients with the
          CC genotype. However, conflicting evidence has been reported. Other genetic and clinical factors may also influence
          a patient's response to risperidone.
      - id: clinpgx_summary_655387652_tt
        label: TT
        binding:
          source: variant
          variant: rs1799978.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype and schizophrenia who are treated with risperidone may be more likely to have improvement
          in symptoms as compared to patients with the CT or CC genotype. However, conflicting evidence has been reported. Other
          genetic and clinical factors may also influence a patient's response to risperidone.
