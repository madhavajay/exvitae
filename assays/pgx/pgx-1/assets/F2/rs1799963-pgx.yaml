      url: https://www.clinpgx.org/labelAnnotation/PA166179855
    notes: Annotation of FDA Label for avatrombopag and F2, F5, PROC, PROS1, SERPINC1
    pgx_action_level: Actionable PGx
    summary:
      The FDA-approved drug label for avatrombopag (DOPTELET) states that the risk for thrombosis should be considered
      in patients with risk factors for thromboembolism, including genetic prothrombotic conditions such as Factor V Leiden
      (F5), Prothrombin 20210A (F2), Antithrombin deficiency (SERPINC1) or Protein C (PROC) or S (PROS1) deficiency.
    prescribing_information:
      Consider the potential increased thrombotic risk when administering DOPTELET to patients with known
      risk factors for thromboembolism, including genetic prothrombotic conditions (e.g., Factor V Leiden, Prothrombin 20210A,
      Antithrombin deficiency or Protein C or S deficiency).
    prescribing_actions:
      - Other Guidance
