    drugs:
      - name: hormonal contraceptives for systemic use
        pharmgkb_id: PA452637
    phenotypes:
      - Stroke
      - Venous Thrombosis
    phenotype_categories:
      - Toxicity
    evidence_level: 2B
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1444672766"
      url: https://www.clinpgx.org/summaryAnnotation/1444672766
    notes: rs1799963 (F2); hormonal contraceptives for systemic use; Stroke and Venous Thrombosis (level 2B Toxicity)
    effects:
      - id: clinpgx_summary_1444672766_aa
        label: AA
        binding:
          source: variant
          variant: rs1799963.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the rs1799963 AA genotype who are taking oral contraceptives (OCs) may have an increased risk for
          deep vein thrombosis (DVT), as compared to patients with the AG or GG genotypes or those who are not taking oral contraceptives.
          However, conflicting evidence has been reported. Other genetic and clinical factors may also influence risk for DVT
          in patients taking oral contraceptives.
      - id: clinpgx_summary_1444672766_ag
        label: AG
        binding:
          source: variant
          variant: rs1799963.yaml
          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the rs1799963 AG genotype who are taking oral contraceptives (OCs) may have an increased risk for
          deep vein thrombosis (DVT), as compared to patients with the GG genotype or those who are not taking oral contraceptives
          and a decreased risk of DVT as compared to patients with the AA genotype. However, conflicting evidence has been reported.
          Other genetic and clinical factors may also influence risk for DVT in patients taking oral contraceptives.
      - id: clinpgx_summary_1444672766_gg
        label: GG
        binding:
          source: variant
          variant: rs1799963.yaml
          allele: G
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype GG.
        text:
          Patients with the rs1799963 GG genotype who are taking oral contraceptives (OCs) may have a decreased risk for deep
          vein thrombosis (DVT), as compared to patients with the AA or AG genotypes or those who are not taking oral contraceptives.
          However, conflicting evidence has been reported. Other genetic and clinical factors may also influence risk for DVT
          in patients taking oral contraceptives.
