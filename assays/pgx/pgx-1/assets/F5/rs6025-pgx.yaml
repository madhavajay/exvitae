    summary: |-
      The EMA-approved EPAR for lusutrombopag (Mulpleo) states that patients with congenital coagulopathy the risk for thrombosis or thromboembolism may increase. These patients should be clinically monitored when treated with lusutrombopag.
      Although the EPAR does not mention specific genes, genetic prothrombotic conditions include Factor V Leiden (F5), Prothrombin 20210A (F2), Antithrombin deficiency (SERPINC1) or Protein C (PROC) or S (PROS1) deficiency.
    prescribing_information:
      In patients with thrombosis or thromboembolism, with a history of thrombosis or thromboembolism,
      with absence of hepatopetal blood flow in the main trunk of the portal vein, or patients with congenital coagulopathy
      the risk for thrombosis or thromboembolism may increase. These patients should be clinically monitored when treated with
      lusutrombopag.
