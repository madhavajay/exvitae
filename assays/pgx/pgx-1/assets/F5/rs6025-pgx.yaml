    pgx_action_level: Actionable PGx
    summary:
      The product monograph for eltrombopag (REVOLADE) states caution should be used in patients with known risk factors
      for thromboembolism including but not limited to inherited (e.g. Factor V Leiden) or acquired risk factors (e.g. ATIII
      deficiency, antiphospholipid syndrome and systemic lupus erythematosus).
    prescribing_information: |-
      Excerpt from the eltrombopag product monograph:
      Caution should be used when administering REVOLADE to patients with known risk factors for thromboembolism including but not limited to inherited (e.g. Factor V Leiden) or acquired risk factors (e.g. ATIII deficiency, antiphospholipid syndrome and systemic lupus erythematosus), advanced age, patients with prolonged periods of immobilisation, malignancies, contraceptives and hormone replacement therapy, surgery/trauma, obesity and smoking. Platelet counts should be closely monitored and consideration given to reducing the dose or discontinuing REVOLADE if the platelet count exceeds the target levels. The risk-benefit balance should be considered in patients at risk of TEEs of any aetiology.
    prescribing_actions:
      - Other Guidance
