    notes: Annotation of EMA Label for avatrombopag and CYP2C9, F2, F5, PROC, PROS1, SERPINC1
    pgx_action_level: Actionable PGx
    summary:
      The EMA European Public Assessment Report (EPAR) for avatrombopag (Doptelet) states that avatrombopag exposure
      may increase in patients with CYP2C9*2 and/or CYP2C9*3 alleles, and that increased exposure may increase the risk of clinically-relevant
      QTc prolongation. The label also states that potential increased thrombotic risk should be considered in patients with
      deficiency in Factor V Leiden ( F5 ), prothrombin 20210A ( F2 ), antithrombin ( SERPINC1 ), protein C ( PROC ), or protein
      S ( PROS1 ).
    prescribing_information: |-
      Caution must also be exercised in patients with loss-of-function polymorphisms of CYP2C9, as these can increase avatrombopag exposure.
      Consider the potential increased thrombotic risk when administering Doptelet to patients with known risk factors for thromboembolism, including but not limited to genetic prothrombotic conditions (e.g. Factor V Leiden, Prothrombin 20210A, Antithrombin deficiency or Protein C or S deficiency), [...]
    prescribing_actions:
      - Other Guidance
