    notes: Annotation of HCSC Label for drospirenone / ethinyl estradiol and F5, PROC, PROS1, SERPINC1
    pgx_action_level: Actionable PGx
    summary:
      The product monograph for drospirenone and ethinyl estradiol (YAZ) states that the drug is contraindicated in women
      with Factor V Leiden mutation, antithrombin III deficiency, protein C deficiency and protein S deficiency (among other
      contraindications), due to the risk for arterial or venous thrombosis.
    prescribing_information: |-
      The product monograph for drospirenone and ethinyl estradiol (YAZ) states:
      YAZ should not be used in women with: presence of severe or multiple risk factor(s) for arterial or venous thrombosis: hereditary or acquired predisposition for venous or arterial thrombosis, such as Factor V Leiden mutation and activated protein C (APC-) resistance, antithrombin-III-deficiency, protein C deficiency, protein S deficiency, hyperhomocysteinemia and antiphospholipid-antibodies (anticardiolipin antibodies, lupus anticoagulant).
    prescribing_actions:
      - Alternate Drug
    related_alleles:
