  - schema: bioscript:pgx-summary:1.0
    id: clinpgx_summary_1183689558
    label: rs6025 / hormonal contraceptives for systemic use / Toxicity
    authority_type: evidence_summary
    genes:
      - F5
    variant: rs6025
    drugs:
      - name: hormonal contraceptives for systemic use
        pharmgkb_id: PA452637
    phenotypes:
      - Thrombotic disease
    phenotype_categories:
      - Toxicity
    evidence_level: 2B
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1183689558"
      url: https://www.clinpgx.org/summaryAnnotation/1183689558
    notes: rs6025 (F5); hormonal contraceptives for systemic use; Thrombosis (level 2B Toxicity)
    effects:
      - id: clinpgx_summary_1183689558_cc
        label: CC
        binding:
          source: variant
          variant: rs6025.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the rs6025 CC genotype (normal Factor V) may have a decreased risk of experiencing thrombosis when
          receiving oral contraceptives as compared to patients with the CT or TT genotype (carriers of Factor V Leiden). However,
          conflicting evidence has been reported. Both Factor V Leiden and oral contraceptives have been found to independently
          increase the risk for thrombosis, but together they may have a cumulative effect on thrombosis risk. Other genetic and
          clinical factors may also influence risk of thrombosis.
      - id: clinpgx_summary_1183689558_ct
        label: CT
        binding:
          source: variant
          variant: rs6025.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the rs6025 CT genotype (heterozygote for Factor V Leiden) may have an increased risk of experiencing
          thrombosis when receiving oral contraceptives as compared to patients with the CC genotype (normal Factor V). However,
          conflicting evidence has been reported. Both Factor V Leiden and oral contraceptives have been found to independently
          increase the risk for thrombosis, but together they may have a cumulative effect on thrombosis risk. Other genetic and
          clinical factors may also influence risk of thrombosis.
      - id: clinpgx_summary_1183689558_tt
        label: TT
        binding:
          source: variant
          variant: rs6025.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the rs6025 TT genotype (homozygote for Factor V Leiden) may have an increased risk of experiencing
          thrombosis when receiving oral contraceptives as compared to patients with the CC genotype (normal Factor V). However,
          conflicting evidence has been reported. Both Factor V Leiden and oral contraceptives have been found to independently
          increase the risk for thrombosis, but together they may have a cumulative effect on thrombosis risk. Other genetic and
          clinical factors may also influence risk of thrombosis.
