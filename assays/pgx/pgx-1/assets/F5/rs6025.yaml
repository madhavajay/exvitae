      label: ClinPGx / PharmGKB variant summary annotations PA166153554 via exr pgx-lookup --sidecar
      url: https://www.clinpgx.org/variant/PA166153554/summaryAnnotation
      fields:
        - findings[0]
    - kind: database
      label: ClinPGx / PharmGKB variant drug label annotations PA166153554 via exr pgx-lookup --sidecar
      url: https://www.clinpgx.org/variant/PA166153554/labelAnnotation
