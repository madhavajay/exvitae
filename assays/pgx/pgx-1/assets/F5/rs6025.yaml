      url: https://www.ncbi.nlm.nih.gov/snp/rs6025
      fields:
        - identifiers.rsids
        - identifiers.aliases
        - alleles
        - alleles.observed_alts
    - kind: database
      label: Ensembl GRCh37 via exr rsid-lookup --store
