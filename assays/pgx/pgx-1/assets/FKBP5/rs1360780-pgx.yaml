    notes:
      rs1360780 (FKBP5); antidepressants, citalopram, clomipramine, lithium, nefazodone, paroxetine or venlafaxine; Depression
      (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_655384568_cc
        label: CC
        binding:
          source: variant
          variant: rs1360780.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype may 1) have decreased response to antidepressants 2) have decreased, but not absent,
          risk for suicide ideation with paroxetine, venlafaxine, clomipramine, lithium, liothyronine or nefazodone as compared
          to patients with the CT or TT genotype. However, contradictory findings regarding an association of the opposite allele
          or no association with response have been reported. Other genetic and clinical factors may also influence a patient's
          response to antidepressants.
      - id: clinpgx_summary_655384568_ct
        label: CT
        binding:
          source: variant
          variant: rs1360780.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype may 1) have increased response to antidepressants 2) have increased risk for suicide
          ideation with paroxetine, venlafaxine, clomipramine, lithium, liothyronine or nefazodone as compared to patients with
          the CC genotype. However, contradictory findings regarding an association of the opposite allele or no association with
          response have been reported. Other genetic and clinical factors may also influence a patient's response to antidepressants.
      - id: clinpgx_summary_655384568_tt
        label: TT
        binding:
          source: variant
          variant: rs1360780.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype may 1) have increased response to antidepressants 2) have increased risk for suicide
          ideation with paroxetine, venlafaxine, clomipramine, lithium, liothyronine or nefazodone as compared to patients with
          the CC genotype. However, contradictory findings regarding an association of the opposite allele or no association with
          response have been reported. Other genetic and clinical factors may also influence a patient's response to antidepressants.
