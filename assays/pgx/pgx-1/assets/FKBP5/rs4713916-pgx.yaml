      (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1183617724_aa
        label: AA
        binding:
          source: variant
          variant: rs4713916.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype may have a better response to antidepressants as compared to patients with the GG
          genotype. Other genetic and clinical factors may also influence a patient's response to antidepressant treatment.
      - id: clinpgx_summary_1183617724_ag
        label: AG
        binding:
          source: variant
          variant: rs4713916.yaml
          allele: G
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype may have a better response to antidepressants as compared to patients with the GG
          genotype or may have a reduced response to antidepressants as compared to patients with the AA genotype. Other genetic
          and clinical factors may also influence a patient's response to antidepressant treatment.
      - id: clinpgx_summary_1183617724_gg
