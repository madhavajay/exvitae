    effects:
      - id: clinpgx_summary_1444666308_aa
        label: AA
        binding:
          source: variant
          variant: rs2832407.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype and who are heavy drinkers or have an alcohol-use disorder may have higher concentrations
          of topiramate, and a poorer response to treatment with the drug, as compared to patients with the CC genotype. Other
          genetic and clinical factors may also influence response or concentrations of topiramate.
      - id: clinpgx_summary_1444666308_ac
        label: AC
        binding:
          source: variant
          variant: rs2832407.yaml
          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AC.
        text:
          Patients with the AC genotype and who are heavy drinkers or have an alcohol-use disorder may have higher concentrations
          of topiramate, and a poorer response to treatment with the drug, as compared to patients with the CC genotype. Other
          genetic and clinical factors may also influence response or concentrations of topiramate.
      - id: clinpgx_summary_1444666308_cc
        label: CC
        binding:
          source: variant
          variant: rs2832407.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype and who are heavy drinkers or have an alcohol-use disorder may have lower concentrations
          of topiramate, and a better response to treatment with the drug, as compared to patients with the AA or AC genotype.
          Other genetic and clinical factors may also influence response or concentrations of topiramate.
