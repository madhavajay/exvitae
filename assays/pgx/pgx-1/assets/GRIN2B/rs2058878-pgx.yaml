    effects:
      - id: clinpgx_summary_1184988860_aa
        label: AA
        binding:
          source: variant
          variant: rs2058878.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype and alcoholism may have an increased response to acamprosate as compared to patients
          with the AT and TT genotypes. Other clinical and genetic factors may also influence response to acamprosate in patients
          with alcoholism.
      - id: clinpgx_summary_1184988860_at
        label: AT
        binding:
          source: variant
          variant: rs2058878.yaml
          allele: A
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AT.
        text:
          Patients with the AT genotype and alcoholism may have an increased response to acamprosate as compared to patients
          with the TT genotype and a decreased response as compared to patients with the AA genotype. Other clinical and genetic
          factors may also influence response to acamprosate in patients with alcoholism.
      - id: clinpgx_summary_1184988860_tt
        label: TT
        binding:
          source: variant
          variant: rs2058878.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype and alcoholism may have a decreased response to acamprosate as compared to patients
          with the AA or AT genotype. Other clinical and genetic factors may also influence response to acamprosate in patients
          with alcoholism.
