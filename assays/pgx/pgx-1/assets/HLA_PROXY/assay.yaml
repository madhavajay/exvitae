schema: bioscript:assay:1.0
version: "1.0"
name: hla_proxy_markers
label: HLA Proxy Markers
summary:
  Descriptive assay that emits one row per HLA proxy marker. rs9263726 is interpreted as a research-use HLA-B*58:01
  proxy for allopurinol-induced SCAR risk; other HLA proxy markers are reported as positive when a non-reference marker
  allele is present and negative when only the reference allele is observed, without aggregate HLA inference.
tags:
  - type:pgx
  - gene:HLA
  - method:proxy-marker
support:
  input:
    - cram
    - vcf
    - snp:23andme
    - snp:23andme:v2
    - snp:23andme:v3
    - snp:23andme:v4
    - snp:23andme:v5
    - snp:ancestrydna
    - snp:dynamicdna
    - snp:genesforgood
members:
  - kind: variant
    path: rs1061235.yaml
    version: "1.0"
  - kind: variant
    path: rs3909184.yaml
    version: "1.0"
  - kind: variant
    path: rs2844682.yaml
    version: "1.0"
  - kind: variant
    path: rs2395029.yaml
    version: "1.0"
  - kind: variant
    path: rs9263726.yaml
    version: "1.0"
analyses:
  - id: hla_proxy_markers
    kind: bioscript
    path: hla_proxy.py
    output_format: tsv
    label: HLA proxy marker list
    derived_from:
      - rs1061235.yaml
      - rs3909184.yaml
      - rs2844682.yaml
      - rs2395029.yaml
      - rs9263726.yaml
    emits:
      - key: hla_proxy_status
        label: HLA proxy status
        value_type: string
        format: badge
      - key: hla_allele
        label: HLA allele proxy
        value_type: string
      - key: rsid
        label: rsID
        value_type: string
      - key: genotype
        label: Marker genotype
        value_type: string
      - key: drug
        label: Drug
        value_type: string
      - key: condition
        label: Condition
        value_type: string
      - key: phenotype
        label: Proxy phenotype
        value_type: string
      - key: interpretation
        label: Interpretation
        value_type: string
    logic:
      description: >
        The script normalizes each observed SNP genotype and emits one row per proxy marker. It no longer emits an
        aggregate HLA proxy key. Non-rs9263726 marker rows report positive when the genotype contains a non-reference
        allele and negative when the genotype is homozygous reference. For rs9263726, G/G is reported as proxy-negative
        for allopurinol-induced SCAR, G/A is reported as proxy-positive / likely HLA-B*58:01 carrier, A/A is reported as
        proxy-positive / likely HLA-B*58:01 carrier, possibly homozygous tag, and C or other alleles are reported as
        unknown.
provenance:
  sources:
    - kind: paper
      label: HLA-A*31:01 proxy SNV performance varies by population
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9046591/
      fields:
        - summary
        - analyses[0].logic
    - kind: paper
      label: rs2844682 and rs3909184 are not reliable HLA-B*15:02 identifiers
      url: https://pubmed.ncbi.nlm.nih.gov/26036218/
      fields:
        - summary
        - analyses[0].logic
    - kind: paper
      label: rs2395029 can tag HLA-B*57:01 in some populations but is not universal
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3700656/
      fields:
        - summary
        - analyses[0].logic
    - kind: paper
      label: rs9263726 HLA-B*58:01 surrogate performance is population-dependent
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6136375/
      fields:
        - summary
        - analyses[0].logic
