    label: rs7997012 / olanzapine / Toxicity
    authority_type: evidence_summary
    genes:
      - HTR2A
    variant: rs7997012
    drugs:
      - name: olanzapine
        pharmgkb_id: PA450688
    phenotypes: []
    phenotype_categories:
      - Toxicity
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "655385613"
      url: https://www.clinpgx.org/summaryAnnotation/655385613
    notes: rs7997012 (HTR2A); olanzapine (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_655385613_aa
        label: AA
        binding:
          source: variant
          variant: rs7997012.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the AA genotype and psychiatric disorders who are treated with olanzapine may have an increased risk
          for more side effects as compared to patients with the AG and GG genotype. Other genetic and clinical factors may also
          influence a patient's risk for side effects with olanzapine treatment.
      - id: clinpgx_summary_655385613_ag
        label: AG
        binding:
          source: variant
          variant: rs7997012.yaml
          allele: G
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the AG genotype and psychiatric disorders who are treated with olanzapine may have a decreased, but
          not absent, risk for more side effects as compared to patients with the AA genotype. Other genetic and clinical factors
          may also influence a patient's risk for side effects with olanzapine treatment.
      - id: clinpgx_summary_655385613_gg
        label: GG
        binding:
          source: variant
          variant: rs7997012.yaml
          allele: G
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype GG.
        text:
          Patients with the GG genotype and psychiatric disorders who are treated with olanzapine may have a decreased, but
          not absent, risk for more side effects as compared to patients with the AA genotype. Other genetic and clinical factors
          may also influence a patient's risk for side effects with olanzapine treatment.
