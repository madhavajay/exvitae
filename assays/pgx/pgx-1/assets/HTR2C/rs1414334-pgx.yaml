  - schema: bioscript:pgx-summary:1.0
    id: clinpgx_summary_1451277440
    label: rs1414334 / risperidone / Toxicity
    authority_type: evidence_summary
    genes:
      - HTR2C
    variant: rs1414334
    drugs:
      - name: risperidone
        pharmgkb_id: PA451257
    phenotypes:
      - Metabolic Syndrome
    phenotype_categories:
      - Toxicity
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1451277440"
      url: https://www.clinpgx.org/summaryAnnotation/1451277440
    notes: rs1414334 (HTR2C); risperidone; Metabolic Syndrome (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_1451277440_c
        label: C
        binding:
          source: variant
          variant: rs1414334.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype C.
          chromosome_count: 1
        text:
          Patients with one X-chromosome and the C genotype who are treated with risperidone may have an increased risk of
          developing metabolic syndrome as compared to patients with the G genotype. Other genetic and clinical factors may also
          influence a patient's risk for developing metabolic syndrome.
      - id: clinpgx_summary_1451277440_cc
        label: CC
        binding:
          source: variant
          variant: rs1414334.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
          chromosome_count: 2
        text:
          Patients with two X-chromosomes and the CC genotype who are treated with risperidone may have an increased risk
          of developing metabolic syndrome as compared to patients with the GG genotype. Other genetic and clinical factors may
          also influence a patient's risk for developing metabolic syndrome. This gene is on the X chromosome therefore some individuals
          may have only one allele.
      - id: clinpgx_summary_1451277440_cg
        label: CG
        binding:
          source: variant
          variant: rs1414334.yaml
          allele: G
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CG.
          chromosome_count: 2
        text:
          Patients with two X-chromosomes and the CG genotype who are treated with risperidone may have an increased risk
          of developing metabolic syndrome as compared to patients with the GG genotype. Other genetic and clinical factors may
          also influence a patient's risk for developing metabolic syndrome. This gene is on the X chromosome therefore some individuals
          may have only one allele.
      - id: clinpgx_summary_1451277440_g
        label: G
        binding:
          source: variant
          variant: rs1414334.yaml
          allele: G
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype G.
          chromosome_count: 1
        text:
          Patients with one X-chromosome and the G genotype who are treated with risperidone may have a decreased risk of
          developing metabolic syndrome as compared to patients with the C genotype. This gene is on the X chromosome and males
          have only one allele. Other genetic and clinical factors may also influence a patient's risk for developing metabolic
          syndrome.
      - id: clinpgx_summary_1451277440_gg
        label: GG
        binding:
          source: variant
          variant: rs1414334.yaml
          allele: G
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype GG.
          chromosome_count: 2
        text:
          Patients with two X-chromosomes and the GG genotype who are treated with risperidone may have a decreased, but not
          absent, risk of developing metabolic syndrome as compared to patients with the CG and CC genotype. Other genetic and
          clinical factors may also influence a patient's risk for developing metabolic syndrome. This gene is on the X chromosome
          therefore some individuals may have only one allele.
