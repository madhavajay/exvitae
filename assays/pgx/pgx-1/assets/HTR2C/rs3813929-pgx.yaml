      url: https://www.clinpgx.org/summaryAnnotation/1451256466
    notes: rs3813929 (HTR2C); clozapine; Mental Disorders and Schizophrenia (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_1451256466_c
        label: C
        binding:
          source: variant
          variant: rs3813929.yaml
          allele: C
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype C.
          chromosome_count: 1
        text:
          Patients with one X-chromosome, the C genotype and psychiatric disorders who are treated with clozapine may have
          an increased risk of weight gain as compared to patients with the T genotype. However, some studies find no association
          with weight gain. Other genetic and clinical factors may also influence a patient's risk for weight gain with antipsychotic
          treatment.
      - id: clinpgx_summary_1451256466_cc
        label: CC
        binding:
          source: variant
          variant: rs3813929.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
          chromosome_count: 2
        text:
          Patients with two X-chromosomes, the CC genotype and psychiatric disorders who are treated with clozapine may have
          an increased risk of weight gain as compared to patients with the TT genotype. However, some studies find no association
          with weight gain. Other genetic and clinical factors may also influence a patient's risk for weight gain with antipsychotic
          treatment. This gene is on the X chromosome therefore some individuals may have only one allele.
      - id: clinpgx_summary_1451256466_ct
        label: CT
