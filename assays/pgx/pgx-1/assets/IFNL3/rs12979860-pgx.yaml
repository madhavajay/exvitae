    notes: Annotation of FDA Label for peginterferon alfa-2b and IFNL3
    pgx_action_level: Informative PGx
    summary:
      "The FDA-approved drug label for peginterferon alfa-2b (PEGINTRON) states that a single nucleotide polymorphism
      near the gene encoding interferon-lambda-3 (IL28B rs12979860 ) was associated with variable sustained viral response (SVR)
      rates. SVR rates by rs12979860 genotype were as follows: CC 66% vs. CT 30% vs. TT 22%."
    related_alleles:
