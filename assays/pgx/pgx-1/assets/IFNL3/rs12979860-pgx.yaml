    notes: Annotation of FDA Label for telaprevir and IFNL3
    pgx_action_level: Informative PGx
    summary:
      "Among both treatment-naïve and previous treatment failures patients with HCV genotype 1 infections, subjects of\
      \ all IL28B genotypes appeared to have higher SVR rates with telaprevir (INCIVEK)-containing regimens compared to PEG-IFN\
      \ \x01alpha and RBV only. Patients with the favorable IFNL3 genotype ( rs12979860 CC) tend to have higher response rates\
      \ (SVR) as compared to patients with the CT or TT genotype with the protease inhibitor combination in treatment naïve\
      \ patients.\nNovember 2024: Please note that telaprevir is shown as discontinued by the FDA. However, this drug is still\
      \ listed on the FDA Table of Pharmacogenomic Biomarkers in Drug Labeling. ClinPGx has therefore decided to keep this annotation\
      \ active until the drug is removed from the FDA Biomarker table."
