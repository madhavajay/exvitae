      The Swiss drug label for sofosbuvir (Sovaldi) states that "consideration should be given to possibly extending
      the duration of therapy beyond 12 weeks up to 24 weeks, in particular for subgroups with one or more of the previously
      identified negative predictive factors associated in the past with lower response rates to interferon-containing therapies
      (e.g. advanced fibrosis/cirrhosis, high initial viral load, black skin, IL28B-Non-CC genotype, earlier non-response to
      peginterferon alfa and ribavirin)."
