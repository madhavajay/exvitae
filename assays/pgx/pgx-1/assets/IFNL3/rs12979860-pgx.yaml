      - name: simeprevir
        pharmgkb_id: PA166122590
    phenotypes:
      - Chronic hepatitis C virus infection
    phenotype_categories:
      - Efficacy
    evidence_level: "3"
    source_type: Summary
    evidence:
      source: ClinPGx
      kind: summary_annotation
      id: "1444930850"
      url: https://www.clinpgx.org/summaryAnnotation/1444930850
    notes:
      rs12979860 (IFNL3, IFNL4); peginterferon alfa-2a, peginterferon alfa-2b, ribavirin and simeprevir; Hepatitis C, Chronic
      (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1444930850_cc
        label: CC
        binding:
          source: variant
          variant: rs12979860.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with CC genotype may have increased response to simeprevir and peginterferon alfa-2a, peginterferon alfa-2b,
          ribavirin therapy in people with Hepatitis C, Chronic as compared to patients with genotype CT or TT. However, RVR and
          SVR rates were higher in simeprevir treatment group than placebo for all genotypes suggesting the role of IFNL3 genotype
          is modest for simeprevir therapy as compare to PEG-IFN/RBV therapy. Other genetic and clinical factors may also influence
          the response to simeprevir based therapy.
      - id: clinpgx_summary_1444930850_ct
        label: CT
        binding:
          source: variant
          variant: rs12979860.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with CT genotype may have decreased response to simeprevir and peginterferon alfa-2a, peginterferon alfa-2b,
          ribavirin therapy in people with Hepatitis C, Chronic as compared to patients with genotype CC. However, RVR and SVR
          rates were higher in simeprevir treatment group than placebo for all genotypes suggesting the role of IFNL3 genotype
          is modest for simeprevir therapy as compare to PEG-IFN/RBV therapy. Other genetic and clinical factors may also influence
          the response to simeprevir based therapy.
      - id: clinpgx_summary_1444930850_tt
        label: TT
        binding:
          source: variant
          variant: rs12979860.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with TT genotype may have decreased response to simeprevir and peginterferon alfa-2a, peginterferon alfa-2b,
          ribavirin therapy in people with Hepatitis C, Chronic as compared to patients with genotype CC. However, RVR and SVR
          rates were higher in simeprevir treatment group than placebo for all genotypes suggesting the role of IFNL3 genotype
          is modest for simeprevir therapy as compare to PEG-IFN/RBV therapy. Other genetic and clinical factors may also influence
          the response to simeprevir based therapy.
