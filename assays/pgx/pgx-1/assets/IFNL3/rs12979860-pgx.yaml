    pgx_action_level: No Clinical PGx
    summary: |-
      The FDA-approved drug label for boceprevir (Victrelis) contains information regarding a genetic variant near the IFNL3 gene (IL28B, rs12979860 , a C to T change) which is a strong predictor of response to peginterferon alfa-2b (PegIntron) / ribavirin (Rebetol) treatment. Boceprevir must not be used as a monotherapy and should only be used in combination with these drugs for the treatment of chronic hepatitis C genotype 1.
      July 2024: Please note that boceprevir is listed as discontinued by the FDA. However, this drug is still on the FDA Table of Pharmacogenomic Biomarkers in Drug Labeling. ClinPGx has therefore decided to keep this annotation active until the drug is removed from the FDA Biomarker table.
