    notes: Annotation of FDA Label for sofosbuvir and IFNL3
    summary:
      Sofosbuvir (SOVALDI) is indicated for the treatment of chronic hepatitis C in combination with ribavirin and/or
      peg-interferon alfa. The FDA-approved drug label for sofosbuvir contains information regarding a genetic variant near
      the IFNL3 gene (IL28B, rs12979860 , a C to T change). Though the sofosbuvir label itself does not discuss why this variant
      is relevant, literature evidence has shown that this variant is a strong predictor of response to peginterferon alfa and
      ribavirin treatment.
    related_alleles:
