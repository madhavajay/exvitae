    notes: rs1801131 (MTHFR); methotrexate; Arthritis, Rheumatoid (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_699639336_gg
        label: GG
        binding:
          source: variant
          variant: rs1801131.yaml
          allele: G
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype GG.
        text:
          Patients with the GG genotype who are treated with methotrexate may have a decreased likelihood of methotrexate
          response as compared to patients with the GT and TT genotypes. This association has been contradicted by at least one
          study, and other studies have found no association of this variant with methotrexate efficacy. Other genetic and clinical
          factors may also influence a patient's response to methotrexate treatment.
      - id: clinpgx_summary_699639336_gt
        label: GT
        binding:
          source: variant
          variant: rs1801131.yaml
          allele: G
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype GT.
        text:
          Patients with the GT genotype and Rheumatoid Arthritis who are treated with methotrexate may have an increased likelihood
          of methotrexate response as compared to patients with the GG genotype, but decreased response as compared to patients
          with the TT genotype. This association has been contradicted by at least one study, and other studies have found no
          association of this variant with methotrexate efficacy. Other genetic and clinical factors may also influence a patient's
          response to methotrexate treatment.
      - id: clinpgx_summary_699639336_tt
        label: TT
        binding:
          source: variant
          variant: rs1801131.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype and Rheumatoid Arthritis who are treated with methotrexate may have an increased likelihood
          of methotrexate response as compared to patients with the GT and GG genotypes. This association has been contradicted
          by at least one study, and other studies have found no association of this variant with methotrexate efficacy. Other
          genetic and clinical factors may also influence a patient's response to methotrexate treatment.
