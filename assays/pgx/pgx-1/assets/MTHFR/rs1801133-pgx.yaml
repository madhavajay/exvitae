          toxicity as compared to patients with the GG genotype, and may be at decreased risk of toxicity compared to patients
          with the AA genotype. However, conflicting evidence has been reported. Other genetic and clinical factors may also influence
          risk of toxicity following methotrexate treatment. This drug-variant pair has been assigned a “no recommendation” by
          DPWG, as it was determined to be not clinically actionable.
