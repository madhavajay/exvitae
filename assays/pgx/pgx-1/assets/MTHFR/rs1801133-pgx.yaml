  - schema: bioscript:pgx-label:1.0
    id: clinpgx_label_PA166127695
    label: Annotation of HCSC Label for ethinyl estradiol / norelgestromin and F2, F5, MTHFR, PROC, PROS1, SERPINC1
    authority_type: regulatory_label
    genes:
      - F2
      - F5
      - MTHFR
      - PROC
      - PROS1
      - SERPINC1
    variant: rs1801133
    drugs:
      - name: ethinyl estradiol
        pharmgkb_id: PA165290929
      - name: norelgestromin
        pharmgkb_id: PA165290929
    regulatory_sources:
      - HCSC
    source_type: Drug Label
    evidence:
      source: ClinPGx
      kind: label_annotation
      id: PA166127695
      url: https://www.clinpgx.org/labelAnnotation/PA166127695
    notes: Annotation of HCSC Label for ethinyl estradiol / norelgestromin and F2, F5, MTHFR, PROC, PROS1, SERPINC1
    pgx_action_level: Actionable PGx
    summary:
      The product monograph for norelgestromin and ethinyl estradiol (EVRA) states that the drug is contraindicated in
      women with Factor V Leiden mutation, antithrombin III deficiency, protein C deficiency, protein S deficiency, hyperhomocysteinemia
      due to mutations in the MTHFR gene and prothrombin mutation G20210A (among other contraindications), due to the risk for
      arterial or venous thrombosis.
    prescribing_information: |-
      Excerpt from the product monograph:
      Contraindications. The EVRA(R) (norelgestromin and ethinyl estradiol) transdermal system should not be used in women with: presence of severe or multiple risk factor(s) for arterial or venous thrombosis such as:
      hereditary or acquired predisposition for venous or arterial thrombosis, such as Factor V Leiden mutation and activated protein C (APC-) resistance, antithrombin-III-deficiency, protein C deficiency, protein S deficiency, hyperhomocysteinemia (e.g., due to MTHFR C677T, A1298 mutations), prothrombin mutation G20210A, and antiphospholipid antibodies (anticardiolipin antibodies, lupus anticoagulant)
    prescribing_actions:
      - Alternate Drug
    related_alleles:
