          variant: rs678849.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          African-American patients with the CC genotype may have an increased response to methadone when being treated for
          opioid dependence, as compared to patients with the CT or TT genotypes. This association was not seen in European-American
          patients. Response to methadone treatment was measured by the number of opioid-positive drug screens during treatment.
          Other genetic and clinical factors may also affect a patient's response to methadone.
