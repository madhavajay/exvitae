    notes: rs678849 (OPRD1); cocaine; Cocaine-Related Disorders (level 3 Toxicity)
    effects:
      - id: clinpgx_summary_1450822690_cc
        label: CC
        binding:
          source: variant
          variant: rs678849.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the CC genotype may be at an increased risk of developing cocaine dependence as compared to patients
          with the CT or TT genotypes. This association was only seen in African American participants. Other genetic or clinical
          factors may also affect a patient's risk of developing cocaine dependence.
      - id: clinpgx_summary_1450822690_ct
        label: CT
        binding:
          source: variant
          variant: rs678849.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the CT genotype may be at a decreased risk of developing cocaine dependence as compared to patients
          with the CC genotype. This association was only seen in African American participants. Other genetic or clinical factors
          may also affect a patient's risk of developing cocaine dependence.
      - id: clinpgx_summary_1450822690_tt
        label: TT
        binding:
          source: variant
          variant: rs678849.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the TT genotype may be at a decreased risk of developing cocaine dependence as compared to patients
          with the CC genotype. This association was only seen in African American participants. Other genetic or clinical factors
          may also affect a patient's risk of developing cocaine dependence.
