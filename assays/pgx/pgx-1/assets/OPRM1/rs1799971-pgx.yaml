    notes: rs1799971 (OPRM1); alfentanil; Pain (level 3 Efficacy)
    effects:
      - id: clinpgx_summary_1450826907_aa
        label: AA
        binding:
          source: variant
          variant: rs1799971.yaml
          allele: A
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype AA.
        text:
          Patients with the rs1799971 AA genotype may have an increased analgesic response to alfentanil as compared to patients
          with the AG or GG genotypes. Note that one study reported a non-significant association. This drug-variant pair has
          been assigned a “no recommendation” by CPIC, as it was determined to be not clinically actionable. Other genetic or
          clinical factors may also affect a patient's response to alfentanil.
      - id: clinpgx_summary_1450826907_ag
        label: AG
        binding:
          source: variant
          variant: rs1799971.yaml
          allele: G
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype AG.
        text:
          Patients with the rs1799971 AG genotype may have a decreased analgesic response to alfentanil as compared to patients
          with the AA genotype. Note that one study reported a non-significant association. This drug-variant pair has been assigned
          a “no recommendation” by CPIC, as it was determined to be not clinically actionable. Other genetic or clinical factors
          may also affect a patient's response to alfentanil.
      - id: clinpgx_summary_1450826907_gg
