    notes: rs9923231 (VKORC1); warfarin; Hemorrhage (level 2A Toxicity)
    effects:
      - id: clinpgx_summary_1449269910_cc
        label: CC
        binding:
          source: variant
          variant: rs9923231.yaml
          allele: C
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype CC.
        text:
          Patients with the rs9923231 CC genotype may have a decreased risk of bleeding when treated with warfarin as compared
          to patients with the CT or TT genotypes. However, conflicting evidence has been reported. Other clinical and genetic
          factors may also influence risk of warfarin-induced bleeding.
      - id: clinpgx_summary_1449269910_ct
        label: CT
        binding:
          source: variant
          variant: rs9923231.yaml
          allele: T
          operator: dosage_equals
          value: 1
          description: Applies when the participant has genotype CT.
        text:
          Patients with the rs9923231 CT genotype may have an increased risk of bleeding when treated with warfarin as compared
          to patients with the CC genotypes. However, conflicting evidence has been reported. Other clinical and genetic factors
          may also influence risk of warfarin-induced bleeding.
      - id: clinpgx_summary_1449269910_tt
        label: TT
        binding:
          source: variant
          variant: rs9923231.yaml
          allele: T
          operator: dosage_equals
          value: 2
          description: Applies when the participant has genotype TT.
        text:
          Patients with the rs9923231 TT genotype may have an increased risk of bleeding when treated with warfarin as compared
          to the CC genotypes. However, conflicting evidence has been reported. Other clinical and genetic factors may also influence
          risk of warfarin-induced bleeding.
