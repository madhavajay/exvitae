    notes: Annotation of FDA Label for warfarin and CYP2C9, VKORC1
    pgx_action_level: Actionable PGx
    summary:
      Warfarin (COUMADIN) is an anticoagulant used as a prophylaxis and to treat venous thrombosis, pulmonary embolism,
      thromboembolic complications from atrial fibrillation and cardiac valve replacement, and to reduce the recurrence of myocardial
      infarction. Pharmacogenomics-related dosing information for CYP2C9 and VKORC1 variants is provided within the label.
    prescribing_information:
      Table 1 in the drug label provides ranges of expected maintenance daily doses of warfarin (COUMADIN)
      based on CYP2C9*2, CYP2C9*3 and "VKORC1−1639G>A (rs9923231)" genotypes.
    prescribing_actions:
