    notes: Annotation of HCSC Label for warfarin and CYP2C9, VKORC1
    pgx_action_level: Actionable PGx
    summary:
      The product monograph for warfarin notes that patients carrying one or two copies of the CYP2C9*2 or *3 alleles
      may require a decreased mean daily warfarin dose, and have an increased bleeding risk, as compared to those homozygous
      for the CYP2C9*1 allele. Additionally, variations in the VKORC1 gene, such as -1639G>A, are also associated with changes
      in the dose requirement of warfarin.
    prescribing_information:
      It is recommended that APO-WARFARIN therapy be initiated with a dose of 2 to 5 mg per day with
      dosage adjustments based on the results of PT/INR determinations. The lower initiation doses should be considered for
      patients with certain genetic variations in CYP2C9 and VKORC1 enzymes [...]
    prescribing_actions:
      - Dosing Info
