schema: bioscript:assay:1.0
version: "1.0"
name: apoe_epsilon_longevity
label: APOE Epsilon Genotype
summary: >
  Classify APOE epsilon status from rs429358 and rs7412 and summarize the longevity literature for epsilon2,
  epsilon3, and epsilon4 patterns. In the Tokyo Centenarian Study (PMID 9212680), APOE epsilon2 was reported more
  frequent and epsilon4 less frequent in centenarians than controls; the authors concluded epsilon2 was positively
  and epsilon4 negatively associated with longevity.
tags:
  - type:longevity
  - gene:APOE
support:
  input:
    - cram
    - vcf
    - snp:23andme
    - snp:23andme:v3
    - snp:23andme:v4
    - snp:23andme:v5
    - snp:genesforgood
members:
  - kind: variant
    path: rs429358.yaml
    version: "1.0"
  - kind: variant
    path: rs7412.yaml
    version: "1.0"
analyses:
  - id: apoe_epsilon
    kind: bioscript
    path: apoe.py
    output_format: tsv
    label: APOE epsilon genotype
    derived_from:
      - rs429358.yaml
      - rs7412.yaml
    emits:
      - key: apoe_outcome
        label: APOE outcome
        value_type: string
        format: badge
      - key: apoe_status
        label: APOE status
        value_type: string
        format: badge
      - key: apoe_longevity_status
        label: APOE longevity status
        value_type: string
        format: badge
      - key: apoe_longevity_context
        label: APOE longevity context
        value_type: string
      - key: apoe_longevity_summary
        label: APOE genotype-specific longevity summary
        value_type: string
      - key: rs429358
        label: rs429358 genotype
        value_type: string
      - key: rs7412
        label: rs7412 genotype
        value_type: string
    logic:
      source:
        name: ClinPGx / PharmGKB and Hirose et al. Tokyo Centenarian Study
        url: https://www.clinpgx.org/variant/PA166155341/overview
      description: >
        APOE epsilon status is derived from rs429358 and rs7412. ClinPGx describes these variants as defining the
        epsilon2, epsilon3, and epsilon4 alleles: E2 is rs429358 T and rs7412 T, E3 is rs429358 T and rs7412 C, and
        E4 is rs429358 C and rs7412 C. The longevity summary is based on Hirose et al. (PMID 9212680), which reported
        epsilon2 was more frequent and epsilon4 less frequent in Japanese centenarians than controls and concluded that
        epsilon2 was positively and epsilon4 negatively associated with longevity. This assay always emits a general APOE
        longevity context field with that epsilon2/epsilon4 statement, plus a genotype-specific summary for the participant's
        resolved APOE epsilon status.
provenance:
  sources:
    - kind: database
      label: ClinPGx rs7412 variant overview
      url: https://www.clinpgx.org/variant/PA166155341/overview
      fields:
        - analyses[0].logic
    - kind: literature
      label: Hirose et al. Tokyo Centenarian Study 1997
      url: https://pubmed.ncbi.nlm.nih.gov/9212680/
      fields:
        - summary
        - analyses[0].logic
