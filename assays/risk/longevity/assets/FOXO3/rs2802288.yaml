findings:
  - schema: bioscript:trait:1.0
    label: FOXO3 longevity association
    binding:
      source: variant
      variant: rs2802288.yaml
      allele: A
      operator: dosage_in
      values: [1, 2]
      description: Applies when the participant carries one or two copies of the literature-supported rs2802288 A allele; A is the reference allele in this catalogue.
    summary: Zeng et al. reported rs2802288*A was associated with longevity in Southern Chinese and in the meta-analysis.
    notes: The paper reports rs2802288*A with OR = 1.266 in the Southern Chinese case-control study; this association remained significant after Bonferroni correction. The meta-analysis reported a pooled OR = 1.146 (95% CI 1.065-1.233).
