findings:
  - schema: bioscript:trait:1.0
    label: FOXO3 longevity association
    binding:
      source: variant
      variant: rs2802292.yaml
      allele: G
      operator: dosage_in
      values: [1, 2]
      description: Applies when the participant carries one or two copies of the literature-supported rs2802292 G allele; G is the reference allele in this catalogue.
    summary: Zeng et al. reported rs2802292*G was associated with longevity in an Asian-stratified meta-analysis.
    notes: In Zeng et al., rs2802292*G had OR = 1.207 in the Southern Chinese case-control study but did not remain significant after Bonferroni correction; their meta-analysis reported association in Asians with OR = 1.385 (95% CI 1.204-1.593). This marker is retained because rs2802292 also has replicated and mechanistic FOXO3 longevity evidence.
  - schema: bioscript:trait:1.0
    label: FOXO3 cellular aging mechanism
    binding:
      source: variant
      variant: rs2802292.yaml
      allele: G
      operator: dosage_in
      values: [1, 2]
      description: Applies when the participant carries one or two copies of the literature-supported rs2802292 G allele; G is the reference allele in this catalogue.
    summary: Torigoe et al. studied rs2802292 and reported protective cellular-aging associations for carriers of the FOXO3 G allele in Okinawan adults.
    notes: The abstract reports protection against telomere shortening, higher telomerase activity in older G-allele carriers, and sex-specific inflammatory cytokine associations.
