findings:
  - schema: bioscript:trait:1.0
    alt: T
    label: PCSK9 R46L LDL-lowering allele
    summary:
      Carrier status marks the PCSK9 R46L allele used in Cohen et al. 2006 as a human genetics example of lower LDL-C
      and reduced coronary heart disease risk.
    notes:
      Cohen et al. reported that 3.2 percent of white ARIC participants had a PCSK9 sequence variant associated with
      15 percent lower LDL cholesterol and 47 percent lower coronary heart disease risk.
