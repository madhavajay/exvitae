summary:
  PCSK9 R46L / Arg46Leu, represented by c.137G>T, is a naturally occurring PCSK9 sequence variant associated in
  Cohen et al. 2006 with lower LDL cholesterol and lower coronary heart disease risk among white ARIC participants.
