findings:
  - schema: bioscript:trait:1.0
    alt: A
    label: PCSK9 C679X LDL-lowering allele
    summary:
      Carrier status marks one of the PCSK9 nonsense alleles used in Cohen et al. 2006 as a human genetics example of
      lower LDL-C and reduced coronary heart disease risk.
    notes:
      Cohen et al. reported that 2.6 percent of black ARIC participants had PCSK9 nonsense mutations associated with
      28 percent lower mean LDL cholesterol and 88 percent lower coronary heart disease risk.
