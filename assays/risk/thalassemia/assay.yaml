schema: "bioscript:assay:1.0"
version: "1.0"
name: "thalassemia"
label: "Thalassemia Variant Classifier"
summary: "Screening classifier that summarizes observed IthaGenes catalogue variants by alpha-globin, beta-globin, and other globin/modifier categories. This is not a diagnostic genotype-phasing assay."
tags:
  - "type:risk"
  - "gene:HBA1"
  - "gene:HBA2"
  - "gene:HBB"

members:
  - kind: "variant-catalogue"
    path: "catalogue/variants.yaml"
    version: "1.0"

analyses:
  - id: "thalassemia_status"
    kind: "bioscript"
    path: "thalassemia.py"
    output_format: "tsv"
    label: "Thalassemia screening status"
    derived_from:
      - "catalogue/variants.yaml"
    assets:
      - id: "variants"
        path: "catalogue/variants.tsv"
      - id: "findings"
        path: "catalogue/findings.tsv"
    emits:
      - key: "thalassemia_status"
        label: "Thalassemia status"
        value_type: "string"
        format: "badge"
      - key: "globin_disorder_types"
        label: "Globin disorder types"
        value_type: "string"
      - key: "allele_functional_classes"
        label: "Allele functional classes"
        value_type: "string"
      - key: "alpha_diplotype"
        label: "Alpha diplotype"
        value_type: "string"
      - key: "beta_diplotype"
        label: "Beta diplotype"
        value_type: "string"
      - key: "alpha_carrier_or_disease_state"
        label: "Alpha carrier/disease state"
        value_type: "string"
      - key: "beta_carrier_or_disease_state"
        label: "Beta carrier/disease state"
        value_type: "string"
      - key: "clinical_severity_phenotype"
        label: "Clinical severity phenotype"
        value_type: "string"
      - key: "transfusion_dependence_phenotype"
        label: "Transfusion-dependence phenotype"
        value_type: "string"
      - key: "special_named_syndromes"
        label: "Special named syndromes"
        value_type: "string"
      - key: "alpha_variant_findings"
        label: "Alpha-globin findings"
        value_type: "integer"
      - key: "beta_variant_findings"
        label: "Beta-globin findings"
        value_type: "integer"
      - key: "other_globin_or_modifier_findings"
        label: "Other globin/modifier findings"
        value_type: "integer"
      - key: "matched_alpha_findings"
        label: "Matched alpha findings"
        value_type: "string"
      - key: "matched_beta_findings"
        label: "Matched beta findings"
        value_type: "string"
      - key: "matched_other_findings"
        label: "Matched other/modifier findings"
        value_type: "string"
      - key: "thalassemia_findings"
        label: "Matched findings"
        value_type: "string"
    logic:
      source:
        name: "GeneReviews Alpha-Thalassemia and TIF hemoglobinopathy prevention/diagnosis booklet"
        url: "https://www.ncbi.nlm.nih.gov/books/NBK1435/"
      description: >
        Summarizes observed catalogue variants. Alpha-thalassemia categories are conservatively framed around
        the GeneReviews principle that severity depends on the number of inactive alpha-globin alleles, with
        HbH disease usually involving three inactive alleles and Hb Bart syndrome four inactive alleles. The
        current script emits explicit not-inferred fields where phase, deletion structure, Hb fractions,
        transfusion history, or clinical severity evidence would be required.
