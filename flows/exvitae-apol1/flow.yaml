apiVersion: syftbox.openmined.org/v1alpha1
kind: Flow
metadata:
  name: exvitae-apol1
  version: 0.2.7
spec:
  inputs:
    samplesheet:
      type: List[GenotypeRecord]
      description: Genotype samplesheet with optional country facet for grouped aggregates.
  steps:
    - id: apol1
      uses: ./module.yaml
      with:
        participants: inputs.samplesheet
      publish:
        participant_reports: Directory(participants)
        country_aggregates: Directory(countries)
        observations: File(observations.tsv)
        reports: File(reports.jsonl)
        analysis: File(analysis.jsonl)
